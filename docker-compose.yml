services:
  backend:
    build: ./backend
    container_name: portafolio_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
    networks:
      - cloudflare

  frontend:
    build: ./frontend
    container_name: portafolio_frontend
    restart: unless-stopped
    ports:
      - "3080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - cloudflare
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: portafolio_cloudflared
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    command: tunnel run
    networks:
      - cloudflare
    depends_on:
      - frontend
      - backend

volumes:
  backend_data:

networks:
  cloudflare:
    external: true